<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Virgilio - Lecce</title>


    <!-- =====================================================
         LEAFLET CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >


    <!-- =====================================================
         CSS DELL'APP
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main id="app">


        <!-- =================================================
             MAPPA
        ================================================== -->

        <div id="map"></div>


        <!-- =================================================
             INTESTAZIONE
        ================================================== -->

        <div id="top-panel">

            <div class="app-title">

                <span class="app-title-main">
                    VIRGILIO
                </span>

                <span class="app-title-sub">
                    Lecce
                </span>

            </div>


            <!-- SELETTORE LINGUA -->

            <div class="language-box">

                <label
                    for="language-select"
                    class="sr-only"
                >
                    Lingua
                </label>

                <select id="language-select">

                    <option value="it">
                        🇮🇹 Italiano
                    </option>

                    <option value="en">
                        🇬🇧 English
                    </option>

                    <option value="es">
                        🇪🇸 Español
                    </option>

                </select>

            </div>

        </div>


        <!-- =================================================
             CONTROLLI CURSORE
        ================================================== -->

        <div id="cursor-controls">

            <button
                id="start-button"
                type="button"
                title="Avvia"
                aria-label="Avvia percorso"
            >
                ▶
            </button>

            <button
                id="pause-button"
                type="button"
                title="Pausa"
                aria-label="Metti in pausa"
            >
                ⏸
            </button>

            <button
                id="reset-button"
                type="button"
                title="Ricomincia"
                aria-label="Ricomincia percorso"
            >
                ↺
            </button>

        </div>


        <!-- =================================================
             STATO PERCORSO
        ================================================== -->

        <div id="route-status">

            <div id="route-status-title">
                Virgilio
            </div>

            <div id="route-status-position">
                1 / 35
            </div>

        </div>


        <!-- =================================================
             SCHEDA MONUMENTO
        ================================================== -->

        <section
            id="monument-panel"
            class="monument-panel hidden"
            aria-hidden="true"
        >

            <button
                id="close-panel"
                class="close-panel"
                type="button"
                aria-label="Chiudi scheda"
            >
                ×
            </button>


            <!-- NOME -->

            <h2 id="monument-name"></h2>


            <!-- CATEGORIA -->

            <div
                id="monument-category"
                class="monument-category"
            ></div>


            <!-- =================================================
                 SEGRETO DI VIRGILIO
            ================================================== -->

            <section class="info-section">

                <h3 id="secret-title">
                    Il Segreto di Virgilio
                </h3>

                <p id="monument-secret"></p>

            </section>


            <!-- =================================================
                 SCOPRI DI PIÙ
            ================================================== -->

            <section class="info-section">

                <h3 id="more-title">
                    Scopri di più
                </h3>

                <p id="monument-more"></p>

            </section>


            <!-- =================================================
                 AUDIO
            ================================================== -->

            <section class="media-section">

                <h3 id="audio-title">
                    Ascolta
                </h3>

                <div id="audio-container"></div>

            </section>


            <!-- =================================================
                 VIDEO
            ================================================== -->

            <section
                id="video-section"
                class="media-section"
            >

                <h3 id="video-title">
                    Guarda il video
                </h3>

                <div id="video-container"></div>

            </section>

        </section>


        <!-- =================================================
             SCHERMATA CARICAMENTO
        ================================================== -->

        <div id="loading-screen">

            <div class="loading-box">

                <div class="loading-spinner"></div>

                <p>
                    Caricamento di Virgilio...
                </p>

            </div>

        </div>

    </main>


    <!-- =====================================================
         LEAFLET JAVASCRIPT
    ====================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
    ></script>


    <!-- =====================================================
         JAVASCRIPT DELL'APP
    ====================================================== -->

    <script src="app.js"></script>

</body>

</html>
