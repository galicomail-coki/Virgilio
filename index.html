<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>A casa di Francesca - Lecce</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MAPPA -->
    <div id="map"></div>

    <!-- INTESTAZIONE -->
    <div id="app-header">

        <div class="header-title">
            A casa di Francesca
        </div>

        <div class="header-address">
            Vico Pompeo dei Renzi 4, 73100 - Lecce
        </div>

        <div class="header-phone">
            +39 338 6116 714
        </div>

    </div>


    <!-- SELETTORE LINGUA -->
    <div id="language-selector">

        <button class="language-btn active" data-lang="it">
            🇮🇹 IT
        </button>

        <button class="language-btn" data-lang="en">
            🇬🇧 EN
        </button>

        <button class="language-btn" data-lang="es">
            🇪🇸 ES
        </button>

    </div>


    <!-- CONTROLLI AUDIO -->
    <div id="audio-controls">

        <button
            id="audio-play"
            class="audio-control"
            title="Ascolta"
        >
            ▶
        </button>

        <button
            id="audio-pause"
            class="audio-control"
            title="Pausa"
        >
            ⏸
        </button>

        <button
            id="audio-repeat"
            class="audio-control"
            title="Ripeti"
        >
            ↻
        </button>

    </div>


    <!-- CURSORE -->
    <div id="route-cursor"></div>


    <!-- POPUP -->
    <div id="place-modal" class="modal hidden">

        <div class="modal-content">

            <button
                id="close-modal"
                class="close-btn"
                aria-label="Chiudi"
            >
                ×
            </button>


            <h2 id="place-name"></h2>


            <!-- SEGRETO -->
            <section class="place-section">

                <h3 id="secret-title">
                    Il Segreto di Virgilio
                </h3>

                <div
                    id="place-secret"
                    class="place-text"
                ></div>

            </section>


            <!-- SCOPRI DI PIÙ -->
            <section
                id="more-section"
                class="place-section expandable-section"
            >

                <h3
                    id="more-title"
                    class="expand-title"
                >
                    Scopri di più
                </h3>

                <div
                    id="place-more"
                    class="place-text more-text collapsed"
                ></div>

                <div
                    id="more-hint"
                    class="more-hint"
                >
                    Clicca per leggere tutto
                </div>

            </section>


            <!-- AUDIO -->
            <section
                id="speech-section"
                class="place-section"
            >

                <h3 id="audio-title">
                    Ascolta
                </h3>

                <p id="audio-description">
                    Premi ▶ per ascoltare il testo.
                </p>

            </section>


            <!-- VIDEO -->
            <section
                id="video-section"
                class="place-section"
            >

                <button
                    id="video-btn"
                    class="video-btn"
                >
                    ▶ Guarda il video
                </button>

            </section>

        </div>

    </div>


    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
    ></script>

    <script src="app.js"></script>

</body>
</html>
