<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Virgilio - Lecce</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfZz4H9Qf8s5w1Y8Z7z7v3X2p3j2c5zE="
        crossorigin=""
    >

    <!-- Stili dell'app -->
    <link rel="stylesheet" href="styl.css">
</head>

<body>

    <!-- =========================================================
         CONTENITORE PRINCIPALE
    ========================================================== -->

    <main id="app">

        <!-- MAPPA -->
        <div id="map"></div>


        <!-- =====================================================
             PANNELLO SUPERIORE
        ====================================================== -->

        <div id="top-panel">

            <div class="app-title">
                <span class="app-title-main">VIRGILIO</span>
                <span class="app-title-sub">Lecce</span>
            </div>

            <!-- SELETTORE LINGUA -->
            <div class="language-box">

                <label for="language-select" class="sr-only">
                    Lingua
                </label>

                <select id="language-select">
                    <option value="it">🇮🇹 Italiano</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="es">🇪🇸 Español</option>
                </select>

            </div>

        </div>


        <!-- =====================================================
             CONTROLLI DEL CURSORE
        ====================================================== -->

        <div id="cursor-controls">

            <button
                id="start-button"
                type="button"
                title="Avvia il percorso"
            >
                ▶
            </button>

            <button
                id="pause-button"
                type="button"
                title="Pausa"
            >
                ⏸
            </button>

            <button
                id="reset-button"
                type="button"
                title="Ricominciar percorso"
            >
                ↺
            </button>

        </div>


        <!-- =====================================================
             INDICATORE PERCORSO
        ====================================================== -->

        <div id="route-status">

            <div id="route-status-title">
                Virgilio
            </div>

            <div id="route-status-position">
                0 / 35
            </div>

        </div>


        <!-- =====================================================
             SCHEDA MONUMENTO
        ====================================================== -->

        <div
            id="monument-panel"
            class="monument-panel hidden"
            aria-hidden="true"
        >

            <button
                id="close-panel"
                class="close-panel"
                type="button"
                aria-label="Chiudi"
            >
                ×
            </button>


            <!-- NOME -->
            <h2 id="monument-name"></h2>


            <!-- CATEGORIA -->
            <div
                id="monument-category"
                class="monument-category"
            ></div>


            <!-- SEGRETO -->
            <section class="info-section">

                <h3 id="secret-title">
                    Il Segreto di Virgilio
                </h3>

                <p id="monument-secret"></p>

            </section>


            <!-- SCOPRI DI PIÙ -->
            <section class="info-section">

                <h3 id="more-title">
                    Scopri di più
                </h3>

                <p id="monument-more"></p>

            </section>


            <!-- AUDIO -->
            <section class="media-section">

                <h3 id="audio-title">
                    Ascolta
                </h3>

                <div id="audio-container"></div>

            </section>


            <!-- VIDEO -->
            <section
                id="video-section"
                class="media-section"
            >

                <h3 id="video-title">
                    Guarda il video
                </h3>

                <div id="video-container"></div>

            </section>

        </div>


        <!-- =====================================================
             MESSAGGIO DI CARICAMENTO
        ====================================================== -->

        <div id="loading-screen">

            <div class="loading-box">

                <div class="loading-spinner"></div>

                <p id="loading-text">
                    Caricamento di Virgilio...
                </p>

            </div>

        </div>

    </main>


    <!-- =========================================================
         LEAFLET JAVASCRIPT
    ========================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>


    <!-- =========================================================
         JAVASCRIPT DELL'APP
    ========================================================== -->

    <script src="app.js"></script>

</body>
</html>
