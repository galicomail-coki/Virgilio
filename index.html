<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progetto Virgilio - Tourist Concierge Lecce</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Selettore Lingua -->
    <div id="language-selector">
        <select id="lang-select">
            <option value="ita" selected>🇮🇹 Italiano</option>
            <option value="ing">🇬🇧 English</option>
            <option value="sp">🇪🇸 Español</option>
        </select>
    </div>

    <!-- Contenitore Mappa -->
    <div id="map"></div>

    <!-- Pannello Dettagli -->
    <div id="details-panel" class="hidden">
        <button id="close-btn">&times;</button>
        <img id="monument-img" src="" alt="Immagine Monumento" class="hidden">
        <h2 id="monument-title"></h2>
        <span id="monument-category"></span>
        
        <button id="speak-btn" class="audio-btn">🔊 Ascolta Audioguida</button>

        <p id="monument-secret"></p>
        <p id="monument-desc"></p>
        
        <div id="video-container" class="hidden">
            <a id="monument-video" href="" target="_blank" class="video-btn">🎥 Guarda il Video</a>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
