<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>A casa di Francesca - Lecce</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =====================================================
         MAPPA
         ===================================================== -->

    <div id="map"></div>


    <!-- =====================================================
         INTESTAZIONE
         ===================================================== -->

    <div id="app-header">

        <div class="header-title">
            A casa di Francesca
        </div>

        <div class="header-address">
            Vico Pompeo dei Renzi 4, 73100 - Lecce
        </div>

        <div class="header-phone">
            +39 338 6116 714
        </div>

    </div>


    <!-- =====================================================
         SELETTORE LINGUA
         ===================================================== -->

    <div
        id="language-selector"
        aria-label="Selezione lingua"
    >

        <button
            class="language-btn language-it active"
            data-lang="it"
            type="button"
        >
            🇮🇹 <span>Italiano</span>
        </button>

        <button
            class="language-btn language-en"
            data-lang="en"
            type="button"
        >
            🇬🇧 <span>English</span>
        </button>

        <button
            class="language-btn language-es"
            data-lang="es"
            type="button"
        >
            🇪🇸 <span>Español</span>
        </button>

    </div>


    <!-- =====================================================
         CONTROLLI AUDIO
         ===================================================== -->

    <div
        id="audio-controls"
        aria-label="Controlli audio"
    >

        <button
            id="audio-play"
            class="audio-control"
            type="button"
            title="Ascolta"
            aria-label="Ascolta"
        >
            ▶
        </button>

        <button
            id="audio-pause"
            class="audio-control"
            type="button"
            title="Pausa"
            aria-label="Pausa"
        >
            ⏸
        </button>

        <button
            id="audio-repeat"
            class="audio-control"
            type="button"
            title="Ripeti"
            aria-label="Ripeti"
        >
            ↻
        </button>

    </div>


    <!-- =====================================================
         CURSORE DEL PERCORSO
         ===================================================== -->

    <div id="route-cursor"></div>


    <!-- =====================================================
         POPUP MONUMENTO
         ===================================================== -->

    <div
        id="place-modal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="place-name"
    >

        <div class="modal-content">

            <button
                id="close-modal"
                class="close-btn"
                type="button"
                aria-label="Chiudi"
            >
                ×
            </button>


            <!-- NOME -->

            <h2 id="place-name"></h2>


            <!-- =================================================
                 SEGRETO DI VIRGILIO
                 ================================================= -->

            <section class="place-section">

                <h3 id="secret-title">
                    Il Segreto di Virgilio
                </h3>

                <div
                    id="place-secret"
                    class="place-text"
                ></div>

            </section>


            <!-- =================================================
                 SCOPRI DI PIÙ
                 ================================================= -->

            <section class="place-section">

                <h3 id="more-title">
                    Scopri di più
                </h3>

                <div
                    id="place-more"
                    class="place-text"
                ></div>

            </section>


            <!-- =================================================
                 AUDIO
                 ================================================= -->

            <section
                id="speech-section"
                class="place-section"
            >

                <h3 id="audio-title">
                    Ascolta
                </h3>

                <p id="audio-description">
                    Premi ▶ per ascoltare il testo.
                </p>

            </section>


            <!-- =================================================
                 VIDEO
                 ================================================= -->

            <section
                id="video-section"
                class="place-section"
            >

                <button
                    id="video-btn"
                    class="video-btn"
                    type="button"
                >
                    ▶ Guarda il video
                </button>

            </section>

        </div>

    </div>


    <!-- =====================================================
         LEAFLET
         ===================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
    ></script>


    <!-- =====================================================
         APPLICAZIONE
         ===================================================== -->

    <script src="app.js"></script>

</body>

</html>
